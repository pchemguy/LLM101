[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dissertation-intro-qa-provider"
version = "0.17.0b1"
requires-python = ">=3.10"

[project.scripts]
provider-runner = "dissertation_intro_qa.cli.provider_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
