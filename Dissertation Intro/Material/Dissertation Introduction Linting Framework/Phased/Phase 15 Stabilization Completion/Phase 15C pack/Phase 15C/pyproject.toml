[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dissertation-intro-qa"
version = "0.15.0c1"
description = "Phase 15C pack for dissertation intro QA stabilization"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0", "PyYAML>=6.0"]

[project.scripts]
intro-qa = "dissertation_intro_qa.cli.intro_qa:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
